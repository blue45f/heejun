name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate guides
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: pnpm 설정
        uses: pnpm/action-setup@v6
      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check validator syntax
        run: node --check scripts/validate-dev-guides.mjs
      - name: Validate development guides
        run: node scripts/validate-dev-guides.mjs
      - name: Check recommendation validator syntax
        run: node --check scripts/validate-recommendation-templates.mjs
      - name: Validate recommendation templates
        run: node scripts/validate-recommendation-templates.mjs
