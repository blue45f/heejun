name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate guides
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Check validator syntax
        run: node --check scripts/validate-dev-guides.mjs

      - name: Validate development guides
        run: node scripts/validate-dev-guides.mjs

      - name: Check recommendation validator syntax
        run: node --check scripts/validate-recommendation-templates.mjs

      - name: Validate recommendation templates
        run: node scripts/validate-recommendation-templates.mjs
      - name: Build portfolio
        run: pnpm build
