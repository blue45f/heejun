<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지를 찾을 수 없음</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1f3a44" />
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        padding: 24px;
        text-align: center;
        max-width: 520px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 16px;
        color: #cbd5e1;
      }
      a {
        color: #60a5fa;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>요청한 페이지를 찾을 수 없습니다.</h1>
      <p>요청하신 URL이 없거나 임시로 접근이 제한되었습니다.</p>
      <a href="/">메인으로 돌아가기</a>
    </div>
  </body>
</html>
