# Netlify 배포 설정 — Vite 빌드 결과물(dist/) 및 SPA 라우팅 서빙
# DNS A 레코드를 75.2.60.5(또는 ALIAS/CNAME → <site>.netlify.app)로 바꾸면
# Netlify가 자동으로 Let's Encrypt 인증서를 발급합니다.

[build]
  publish = "dist"
  command = "pnpm run build"

[build.environment]
  NODE_VERSION = "24"

# www → apex 도메인으로 통일 (301 영구 리다이렉트)
[[redirects]]
  from = "https://www.heejun.store/*"
  to = "https://heejun.store/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.heejun.store/*"
  to = "https://heejun.store/:splat"
  status = 301
  force = true

# HTTP → HTTPS 강제
[[redirects]]
  from = "http://heejun.store/*"
  to = "https://heejun.store/:splat"
  status = 301
  force = true

# SPA 클라이언트 사이드 라우팅 리다이렉트 폴백
# (디스크에 정적 파일이 실재하는 경우 그 파일을 서빙하고, 그 외에는 index.html로 포워딩합니다.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 전역 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    # CSP — index.html이 실제로 쓰는 출처만 허용한다(검증: scripts 'unsafe-inline'은
    # JSON-LD·인라인 <script>·onclick 핸들러 때문, style 'unsafe-inline'은 인라인
    # <style>·style= 속성 때문. 정적 HTML을 빌드 없이 그대로 배포하므로 nonce 주입 불가).
    # 외부 출처: html2pdf=cdnjs/unpkg, Pretendard 폰트 CSS·woff2=jsdelivr.
    # 새 외부 자원을 추가하면 반드시 이 directive도 함께 갱신할 것. docs/DEPLOYMENT.md 참고.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests"

# HTML/마크다운: 캐시 짧게 (콘텐츠 변경 즉시 반영)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.md"
  [headers.values]
    Cache-Control = "public, max-age=300"

# 정적 자산은 길게 (필요 시 파일명 해시로 무효화)
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
